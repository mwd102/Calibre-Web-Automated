name: Hyperion image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/mwd102/calibre-web-automated:hyperion-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/mwd102/Calibre-Web-Automated
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Opinionated CWA fork with Pastel theme and improved Kobo delivery
          build-args: |
            VERSION=hyperion-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "ghcr.io/mwd102/calibre-web-automated@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
